<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Photo Gallery | Jumayira Residency Hotel</title>
    <meta name="description" content="View the complete photo gallery of Jumayira Residency hotel in Kovalam Kerala.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --red: #B91C1C;
            --redDark: #7F1D1D;
            --black: #1A1A1A;
            --white: #FFFFFF;
            --cream: #FDF6F0;
            --warmGray: #6B6B6B;
            --lightGray: #F0F0F0;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html { overflow-x: hidden; }

        body {
            font-family: 'Raleway', sans-serif;
            background: var(--lightGray);
            color: var(--black);
            line-height: 1.6;
            overflow-x: hidden;
        }

        img { max-width: 100%; height: auto; display: block; }

        nav {
            background: var(--black);
            padding: 0.8rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .navBrand { display: flex; align-items: center; gap: 10px; text-decoration: none; }

        .navBrandImg { height: 40px; width: auto; }

        .backBtn {
            font-weight: 600;
            color: var(--white);
            background: var(--red);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 0.8rem;
            padding: 10px 22px;
            border-radius: 3px;
            transition: background 0.3s ease;
        }

        .backBtn:hover { background: var(--redDark); }

        .galleryHeader {
            text-align: center;
            padding: 4rem 5% 2rem 5%;
            max-width: 800px;
            margin: 0 auto;
        }

        .sectionLabel {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--red);
            margin-bottom: 0.5rem;
        }

        .accentLine {
            width: 50px;
            height: 3px;
            background: var(--red);
            margin: 0 auto 1.5rem auto;
        }

        .galleryHeader h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2rem, 5vw, 3rem);
            color: var(--black);
            margin-bottom: 0.5rem;
        }

        .galleryHeader p { color: var(--warmGray); font-size: 1rem; }

        .galleryGrid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 0 5% 5rem 5%;
            max-width: 1600px;
            margin: 0 auto;
        }

        .galleryImg {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--black);
        }

        .galleryImg:hover {
            transform: scale(1.02);
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            z-index: 10;
            position: relative;
        }

        @media (max-width: 768px) {
            nav { justify-content: center; flex-direction: column; gap: 12px; }
            .backBtn { width: 100%; text-align: center; }
            .galleryGrid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
        }

        @media (max-width: 480px) {
            .galleryGrid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="navBrand">
            <img src="Logo.png" alt="Jumayira Residency" class="navBrandImg">
        </a>
        <a href="index.html" class="backBtn">← Back to Home</a>
    </nav>

    <div class="galleryHeader">
        <div class="sectionLabel">Gallery</div>
        <div class="accentLine"></div>
        <h1>Property Gallery</h1>
        <p>Photos of Jumayira Residency, Vizhinjam, Kovalam</p>
    </div>

    <div class="galleryGrid">
        <img src="Hero.jpg" class="galleryImg" alt="Exterior View" loading="lazy">

</body>
